<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yes as a service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Noto Sans', sans-serif;
        color: #1e1e1e;
        background: #f8f8f8;
      }
      main { text-align: center; padding: 1.5rem; }
      h1 { margin: 0 0 1rem; font-size: 1.8rem; }
      fieldset { margin: 0; padding: 0; border: 0; }
      .kinds { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-bottom: 0.9rem; }
      label { font-size: 0.95rem; }
      button {
        border: 1px solid #ccc;
        border-radius: 999px;
        background: #fff;
        padding: 0.45rem 0.85rem;
        cursor: pointer;
      }
      #phrase {
        margin-top: 1.4rem;
        min-height: 1.5em;
        font-size: 1.15rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yes as a service</h1>
      <form id="yes-form" method="GET" action="/">
        <fieldset>
          <div class="kinds">
            <label><input type="radio" name="kind" value="any" {{CHECKED_ANY}} /> Any</label>
            <label><input type="radio" name="kind" value="agree" {{CHECKED_AGREE}} /> Agree</label>
            <label><input type="radio" name="kind" value="confirm" {{CHECKED_CONFIRM}} /> Confirm</label>
            <label><input type="radio" name="kind" value="contradict" {{CHECKED_CONTRADICT}} /> Contradict</label>
            <label><input type="radio" name="kind" value="encourage" {{CHECKED_ENCOURAGE}} /> Encourage</label>
          </div>
        </fieldset>
        <button type="submit" aria-label="Refresh phrase">&#x21bb; Refresh</button>
      </form>
      <p id="phrase">{{PHRASE_PLACEHOLDER}}</p>
    </main>
    <script>
      (() => {
        const form = document.getElementById('yes-form');
        const phraseNode = document.getElementById('phrase');

        const requestPhrase = async () => {
          const data = new FormData(form);
          const params = new URLSearchParams();
          const kind = data.get('kind');

          if (kind && kind !== 'any') {
            params.set('kind', kind);
          }

          const query = params.toString();
          const response = await fetch('/yes' + (query ? '?' + query : ''));
          if (!response.ok) {
            return;
          }

          const payload = await response.json();
          phraseNode.textContent = payload.text;

          const url = new URL(window.location.href);
          if (kind && kind !== 'any') {
            url.searchParams.set('kind', kind);
          } else {
            url.searchParams.delete('kind');
          }
          window.history.replaceState({}, '', url);
        };

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          requestPhrase();
        });

        form.addEventListener('change', (event) => {
          if (event.target.name === 'kind') {
            requestPhrase();
          }
        });
      })();
    </script>
  </body>
</html>
